@if (toasts().length > 0) {
  <div
    class="toast-container"
    role="region"
    aria-label="Notificações"
    data-testid="toast-container"
  >
    @for (toast of toasts(); track toast.id) {
      <div
        [attr.role]="toast.variant === 'success' ? 'status' : 'alert'"
        [attr.aria-live]="toast.variant === 'success' ? 'polite' : 'assertive'"
        class="toast-item"
        [class.toast-item--success]="toast.variant === 'success'"
        data-testid="toast-item"
      >
        <div class="toast-content">
          @if (toast.variant === 'success') {
            <svg class="toast-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
          } @else {
          <svg
            class="toast-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
              clip-rule="evenodd"
            />
          </svg>
          }
          <p class="toast-message">
            {{ toast.message }}
          </p>
        </div>

        <button
          type="button"
          (click)="dismiss(toast.id)"
          aria-label="Fechar notificação"
          class="toast-dismiss"
          data-testid="toast-dismiss-button"
        >
          <svg
            class="toast-dismiss-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    }
  </div>
}
