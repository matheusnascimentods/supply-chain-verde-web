<nav class="shared-pagination" [attr.aria-label]="label()">
  <button type="button" class="shared-pagination-button" appButton [variant]="'primary'" [size]="'small'" [disabled]="disabled() || page() <= 1" (click)="previous.emit()">Anterior</button>
  <span class="shared-pagination-status" aria-live="polite">Página {{ page() }} de {{ totalPages() }}</span>
  <button type="button" class="shared-pagination-button" appButton [variant]="'primary'" [size]="'small'" [disabled]="disabled() || page() >= totalPages()" (click)="next.emit()">Próxima</button>
</nav>
