<div class="enum-field" data-testid="enum-select-container">
  @if (label()) {
    <label
      [for]="id()"
      class="enum-label"
      data-testid="enum-select-label"
    >
      {{ label() }}
      @if (required()) {
        <span class="required-marker" aria-hidden="true">*</span>
      }
    </label>
  }

  <select
    [id]="id()"
    [name]="name() || id()"
    [disabled]="effectiveDisabled()"
    [required]="required()"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? id() + '-error' : null"
    [value]="effectiveValue()"
    (change)="onSelectChange($event)"
    (blur)="onBlur()"
    class="enum-control"
    data-testid="enum-select-element"
  >
    @if (placeholder()) {
      <option value="" [disabled]="required()">
        {{ placeholder() }}
      </option>
    }

    @for (opt of parsedOptions(); track opt) {
      <option [value]="opt">
        {{ getOptionLabel(opt) }}
      </option>
    }
  </select>

  @if (error()) {
    <p
      [id]="id() + '-error'"
      class="enum-error"
      role="alert"
      data-testid="enum-select-error"
    >
      {{ error() }}
    </p>
  }
</div>
