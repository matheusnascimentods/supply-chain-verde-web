@if (isOpen()) {
  <div
    class="dialog-backdrop"
    (click)="onBackdropClick($event)"
    data-testid="dialog-backdrop"
  >
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      [attr.aria-describedby]="message() ? 'confirm-dialog-description' : null"
      class="dialog-panel"
      data-testid="dialog-container"
    >
      <div class="dialog-header">
        <h2
          id="confirm-dialog-title"
          class="dialog-title"
        >
          {{ title() }}
        </h2>
        <button
          type="button"
          (click)="onCancel()"
          aria-label="Fechar diálogo"
          class="dialog-close"
          data-testid="dialog-close-button"
        >
          <svg
            class="dialog-close-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      @if (message()) {
        <p
          id="confirm-dialog-description"
          class="dialog-message"
        >
          {{ message() }}
        </p>
      }

      <div class="dialog-actions">
        <button
          type="button"
          (click)="onCancel()"
          class="dialog-cancel"
          data-testid="dialog-cancel-button"
        >
          {{ cancelText() }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="dialog-confirm"
          [class.dialog-confirm-danger]="variant() === 'danger'"
          [class.dialog-confirm-primary]="variant() === 'primary'"
          data-testid="dialog-confirm-button"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
