@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs transition-opacity"
    (click)="onBackdropClick($event)"
    data-testid="dialog-backdrop"
  >
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      [attr.aria-describedby]="message() ? 'confirm-dialog-description' : null"
      class="w-full max-w-md rounded-xl bg-white p-6 shadow-2xl ring-1 ring-slate-900/10 dark:bg-slate-800 dark:ring-white/10"
      data-testid="dialog-container"
    >
      <div class="flex items-start justify-between gap-4">
        <h2
          id="confirm-dialog-title"
          class="text-lg font-semibold text-slate-900 dark:text-white"
        >
          {{ title() }}
        </h2>
        <button
          type="button"
          (click)="onCancel()"
          aria-label="Fechar diálogo"
          class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus:outline-hidden focus:ring-2 focus:ring-slate-400 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-200 cursor-pointer"
          data-testid="dialog-close-button"
        >
          <svg
            class="h-5 w-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      @if (message()) {
        <p
          id="confirm-dialog-description"
          class="mt-3 text-sm text-slate-600 dark:text-slate-300"
        >
          {{ message() }}
        </p>
      }

      <div class="mt-6 flex items-center justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          class="inline-flex justify-center items-center px-4 py-2 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus:outline-hidden focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 dark:bg-slate-700 dark:text-slate-200 dark:border-slate-600 dark:hover:bg-slate-600 cursor-pointer"
          data-testid="dialog-cancel-button"
        >
          {{ cancelText() }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [class]="confirmButtonClasses()"
          data-testid="dialog-confirm-button"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
