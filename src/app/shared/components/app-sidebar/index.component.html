<aside class="border-b border-slate-200 bg-white p-5 md:min-h-screen md:w-60 md:shrink-0 md:border-b-0 md:border-r md:px-5 md:py-6">
  <a routerLink="/dashboard" class="flex items-center gap-2.5 text-sm font-bold tracking-tight text-slate-900" aria-label="Supply Chain Verde, dashboard">
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-green-600 text-white" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 4c-7 0-12 2-13 7-1 4 2 7 6 6 5-1 7-6 7-13Z"/><path d="M4 21c2-5 5-8 11-11"/>
      </svg>
    </span>
    <span>Supply Chain Verde</span>
  </a>

  <nav class="mt-6 flex gap-2 overflow-x-auto md:flex-col" aria-label="Navegação principal">
    <a routerLink="/dashboard" routerLinkActive="bg-green-50 text-green-700" [routerLinkActiveOptions]="{ exact: true }" class="shrink-0 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">Dashboard</a>
    @for (link of links(); track link.path) {
      <a [routerLink]="link.path" routerLinkActive="bg-green-50 text-green-700" class="shrink-0 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">{{ link.label }}</a>
    }
  </nav>
</aside>
