@if (toasts().length > 0) {
  <div
    class="fixed bottom-4 right-4 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none p-4"
    role="region"
    aria-label="Notificações de erro"
    data-testid="toast-container"
  >
    @for (toast of toasts(); track toast.id) {
      <div
        role="alert"
        aria-live="assertive"
        class="pointer-events-auto flex items-start justify-between gap-3 p-4 rounded-xl bg-red-600 text-white shadow-xl ring-1 ring-red-700/50 transition-all duration-200"
        data-testid="toast-item"
      >
        <div class="flex items-start gap-3">
          <svg
            class="h-5 w-5 shrink-0 text-white mt-0.5"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
              clip-rule="evenodd"
            />
          </svg>
          <p class="text-sm font-medium leading-5 break-words">
            {{ toast.message }}
          </p>
        </div>

        <button
          type="button"
          (click)="dismiss(toast.id)"
          aria-label="Fechar notificação"
          class="shrink-0 rounded-lg p-1 text-red-100 hover:bg-red-700/50 hover:text-white focus:outline-hidden focus:ring-2 focus:ring-white cursor-pointer"
          data-testid="toast-dismiss-button"
        >
          <svg
            class="h-4 w-4"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    }
  </div>
}
