<div
  role="status"
  aria-live="polite"
  [class.spinner-fullscreen]="fullScreen()"
  [class.spinner-inline]="!fullScreen()"
  data-testid="spinner-container"
>
  <svg
    class="spinner-icon"
    [class.spinner-sm]="size() === 'sm'"
    [class.spinner-md]="size() === 'md'"
    [class.spinner-lg]="size() === 'lg'"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    aria-hidden="true"
    data-testid="spinner-svg"
  >
    <circle
      class="spinner-track"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"
    ></circle>
    <path
      class="spinner-progress"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
    ></path>
  </svg>

  <span class="sr-only">{{ ariaLabel() }}</span>

  @if (message()) {
    <p
      class="spinner-message"
      data-testid="spinner-message"
    >
      {{ message() }}
    </p>
  }
</div>
