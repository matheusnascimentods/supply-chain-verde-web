<main class="mx-auto max-w-3xl p-6"><a [routerLink]="['/batches', route.snapshot.paramMap.get('batchId'), 'stages']" class="text-emerald-700 underline">← Etapas</a><h1 class="my-5 text-2xl font-bold">Registrar etapa da cadeia</h1><form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 rounded-xl border bg-white p-6 sm:grid-cols-2"><app-enum-select label="Tipo de etapa" [options]="stageTypes" formControlName="stageType" [required]="true" /><label class="grid gap-1">Início<input class="rounded border p-2" type="datetime-local" formControlName="startedAt" /></label><label class="grid gap-1">Fim<input class="rounded border p-2" type="datetime-local" formControlName="endedAt" /></label><fieldset class="grid gap-3 rounded border p-3"><legend>Origem (opcional)</legend><input class="rounded border p-2" placeholder="Rua" formControlName="originStreet"/><input class="rounded border p-2" placeholder="Número" formControlName="originNumber"/><input class="rounded border p-2" placeholder="Cidade" formControlName="originCity"/><input class="rounded border p-2" placeholder="Estado" formControlName="originState"/></fieldset><fieldset class="grid gap-3 rounded border p-3"><legend>Destino (opcional)</legend><input class="rounded border p-2" placeholder="Rua" formControlName="destinationStreet"/><input class="rounded border p-2" placeholder="Número" formControlName="destinationNumber"/><input class="rounded border p-2" placeholder="Cidade" formControlName="destinationCity"/><input class="rounded border p-2" placeholder="Estado" formControlName="destinationState"/></fieldset>@if(isTransport){<section class="grid gap-3 rounded border border-emerald-300 p-3 sm:col-span-2"><h2 class="font-semibold">Dados do transporte</h2><app-enum-select label="Modal" [options]="transportModes" formControlName="transportMode" [required]="true"/><label class="grid gap-1">Distância (km)<input class="rounded border p-2" type="number" min="0.01" formControlName="distance"/></label><app-enum-select label="Combustível" [options]="fuelTypes" formControlName="fuelType" [required]="true"/><label class="grid gap-1">Capacidade<input class="rounded border p-2" type="number" min="0.01" formControlName="capacity"/></label></section>}<section class="grid gap-3 sm:col-span-2"><h2 class="font-semibold">Calcular emissão da etapa</h2><app-enum-select label="Metodologia" [options]="calculationMethods" formControlName="calculationMethod" [required]="true"/></section>@if(error()){<p class="text-red-700 sm:col-span-2" role="alert">{{error()}}</p>}<button [disabled]="saving()" class="rounded bg-emerald-700 px-4 py-2 text-white sm:col-span-2">{{saving()?'Registrando…':'Registrar etapa e calcular emissão'}}</button></form></main>
