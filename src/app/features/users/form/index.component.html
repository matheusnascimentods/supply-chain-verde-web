<form [formGroup]="form" (ngSubmit)="submit()" class="component-style-1">
  <div class="component-style-2">
    <label class="component-style-3" for="user-name">Nome
      <input id="user-name" class="component-style-4" type="text" autocomplete="name" formControlName="name" />
      @if (form.controls.name.touched && form.controls.name.hasError('required')) { <span class="component-style-5">Informe o nome.</span> }
    </label>
    <label class="component-style-3" for="user-email">Email
      <input id="user-email" class="component-style-4" type="email" autocomplete="email" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.hasError('required')) { <span class="component-style-5">Informe o email.</span> }
      @else if (form.controls.email.touched && form.controls.email.hasError('email')) { <span class="component-style-5">Informe um email válido.</span> }
    </label>
  </div>
  <div class="component-style-2">
    <label class="component-style-3" for="user-password">Senha
      <input id="user-password" class="component-style-4" type="password" autocomplete="new-password" formControlName="password" />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) { <span class="component-style-5">Informe a senha.</span> }
    </label>
    <label class="component-style-3" for="user-role">Role
      <app-enum-select id="user-role" [options]="userRoleSchema.options" [formControlName]="'role'" />
      @if (form.controls.role.touched && form.controls.role.hasError('required')) { <span class="component-style-5">Selecione um perfil.</span> }
    </label>
  </div>
  @if (error()) { <p role="alert" class="component-style-6">{{ error() }}</p> }
  <div class="component-style-7">
    <button type="button" class="component-style-8" [disabled]="saving()" (click)="cancelled.emit()">Cancelar</button>
    <button type="submit" class="component-style-9" [disabled]="form.invalid || saving()">{{ saving() ? 'Salvando…' : 'Adicionar usuário' }}</button>
  </div>
</form>
