<main class="mx-auto max-w-6xl p-6"><h1 class="mb-5 text-2xl font-bold">Auditoria do sistema</h1><form class="mb-5 grid gap-3 rounded-xl border bg-white p-4 sm:grid-cols-4" (ngSubmit)="search()"><label class="grid gap-1">ID do usuário<input class="rounded border p-2" name="userId" [ngModel]="userId()" (ngModelChange)="userId.set($event)" /></label><label class="grid gap-1">Ação<input class="rounded border p-2" name="action" [ngModel]="action()" (ngModelChange)="action.set($event)" /></label><label class="grid gap-1">Tabela afetada<input class="rounded border p-2" name="tableAffected" [ngModel]="tableAffected()" (ngModelChange)="tableAffected.set($event)" /></label><button class="self-end rounded bg-emerald-700 px-4 py-2 text-white">Filtrar</button></form>@if(error()){<p role="alert" class="mb-3 text-red-700">{{error()}}</p>}<div class="overflow-x-auto rounded-xl border bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-3">Data</th><th class="p-3">Usuário</th><th class="p-3">Ação</th><th class="p-3">Tabela</th><th class="p-3">Detalhes</th></tr></thead><tbody>@for(log of logs();track log.auditLogId){<tr class="border-t"><td class="p-3">{{log.timestamp|date:'short'}}</td><td class="p-3">{{log.userId}}</td><td class="p-3">{{log.action}}</td><td class="p-3">{{log.tableAffected ?? log.entity}}</td><td class="p-3">{{log.details}}</td></tr>}@empty{<tr><td class="p-3" colspan="5">Nenhum registro encontrado.</td></tr>}</tbody></table></div></main>
