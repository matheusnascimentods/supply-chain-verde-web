<main class="component-style-1">
  <section
    class="component-style-2"
    aria-labelledby="login-title"
  >
    <header class="component-style-3">
      <div class="component-style-4">
        <span class="component-style-5" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="component-style-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4c-7 0-12 2-13 7-1 4 2 7 6 6 5-1 7-6 7-13Z" />
            <path d="M4 21c2-5 5-8 11-11" />
          </svg>
        </span>
        <span class="component-style-7">Supply Chain Verde</span>
      </div>
      <h1 id="login-title" class="component-style-8">
        Bem-vindo de volta
      </h1>
      <p class="component-style-9">Entre com suas credenciais para acessar o sistema</p>
    </header>

    @if (errorMessage()) {
      <div
        role="alert"
        aria-live="assertive"
        class="component-style-10"
        data-testid="error-alert"
      >
        <p class="component-style-11" data-testid="error-message">{{ errorMessage() }}</p>
      </div>
    }

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      novalidate
      aria-label="Formulário de login"
      class="component-style-12"
    >
      <div>
        <label for="email" class="component-style-13">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="thiago.mendes@empresa.com"
          [attr.aria-invalid]="isFieldInvalid('email')"
          [attr.aria-describedby]="isFieldInvalid('email') ? 'email-error' : null"
          class="component-style-14"
          data-testid="email-input"
        />
        @if (isFieldInvalid('email')) {
          <p id="email-error" role="alert" class="component-style-15" data-testid="email-error">
            {{ getEmailErrorMessage() }}
          </p>
        }
      </div>

      <div>
        <label for="password" class="component-style-13">Senha</label>
        <div class="component-style-16">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            [attr.aria-invalid]="isFieldInvalid('password')"
            [attr.aria-describedby]="isFieldInvalid('password') ? 'password-error' : null"
            class="component-style-17"
            data-testid="password-input"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Exibir senha'"
            class="component-style-18"
            data-testid="toggle-password-visibility"
          >
            {{ showPassword() ? 'Ocultar' : 'Exibir' }}
          </button>
        </div>
        @if (isFieldInvalid('password')) {
          <p id="password-error" role="alert" class="component-style-15" data-testid="password-error">
            {{ getPasswordErrorMessage() }}
          </p>
        }
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="component-style-19"
        data-testid="submit-button"
      >
        @if (isLoading()) {
          <span class="component-style-20">
            <app-spinner size="sm" ariaLabel="Autenticando..." />
            <span>Entrando...</span>
          </span>
        } @else {
          Entrar
        }
      </button>
    </form>
  </section>

  <app-error-toast />
</main>
