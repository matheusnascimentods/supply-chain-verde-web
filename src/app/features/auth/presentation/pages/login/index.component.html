<main class="login-page">
  <section
    class="login-card"
    aria-labelledby="login-title"
  >
    <header class="login-header">
      <div class="login-brand">
        <span class="login-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="login-brand-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4c-7 0-12 2-13 7-1 4 2 7 6 6 5-1 7-6 7-13Z" />
            <path d="M4 21c2-5 5-8 11-11" />
          </svg>
        </span>
        <span class="login-brand-name">Supply Chain Verde</span>
      </div>
      <h1 id="login-title" class="login-title">
        Bem-vindo de volta
      </h1>
      <p class="login-subtitle">Entre com suas credenciais para acessar o sistema</p>
    </header>

    @if (errorMessage()) {
      <div
        role="alert"
        aria-live="assertive"
        class="login-alert"
        data-testid="error-alert"
      >
        <p class="login-alert-message" data-testid="error-message">{{ errorMessage() }}</p>
      </div>
    }

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      novalidate
      aria-label="Formulário de login"
      class="login-form"
    >
      <div>
        <label for="email" class="login-label">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="thiago.mendes@empresa.com"
          [attr.aria-invalid]="isFieldInvalid('email')"
          [attr.aria-describedby]="isFieldInvalid('email') ? 'email-error' : null"
          class="login-input"
          data-testid="email-input"
        />
        @if (isFieldInvalid('email')) {
          <p id="email-error" role="alert" class="login-field-error" data-testid="email-error">
            {{ getEmailErrorMessage() }}
          </p>
        }
      </div>

      <div>
        <label for="password" class="login-label">Senha</label>
        <div class="login-password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            [attr.aria-invalid]="isFieldInvalid('password')"
            [attr.aria-describedby]="isFieldInvalid('password') ? 'password-error' : null"
            class="login-password-input"
            data-testid="password-input"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Exibir senha'"
            class="login-password-toggle"
            data-testid="toggle-password-visibility"
          >
            {{ showPassword() ? 'Ocultar' : 'Exibir' }}
          </button>
        </div>
        @if (isFieldInvalid('password')) {
          <p id="password-error" role="alert" class="login-field-error" data-testid="password-error">
            {{ getPasswordErrorMessage() }}
          </p>
        }
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="login-submit"
        data-testid="submit-button"
      >
        @if (isLoading()) {
          <span class="login-submit-loading">
            <app-spinner size="sm" ariaLabel="Autenticando..." />
            <span>Entrando...</span>
          </span>
        } @else {
          Entrar
        }
      </button>
    </form>
  </section>

  <app-error-toast />
</main>
