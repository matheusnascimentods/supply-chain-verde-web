<main class="mx-auto max-w-6xl p-6"><header class="mb-6 flex items-center justify-between"><h1 class="text-2xl font-bold text-slate-900">Fornecedores</h1><a class="rounded-lg bg-emerald-700 px-4 py-2 text-white" routerLink="new">Novo</a></header><form class="mb-4 flex gap-2" (ngSubmit)="reload()"><input aria-label="Buscar fornecedores" class="flex-1 rounded border p-2" name="search" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Nome ou CNPJ"/><button class="rounded bg-slate-800 px-4 py-2 text-white">Buscar</button><a class="rounded border px-4 py-2" routerLink="ranking">Ver ranking</a></form>
