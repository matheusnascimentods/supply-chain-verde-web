<app-modal labelledBy="supplier-certifications-title" size="lg" (dismissed)="dismissed.emit()">
  <header class="certifications-header">
    <div>
      <h2 id="supplier-certifications-title" class="certifications-title">Certificações de {{ supplierName() }}</h2>
      <p class="certifications-subtitle">Consulte os certificados e seus status. Só o fornecedor atualiza as próprias certificações.</p>
    </div>
    <button type="button" class="certifications-close" aria-label="Fechar certificações" (click)="dismissed.emit()">&times;</button>
  </header>

  <div class="certifications-body">
    <app-certification-list [certifications]="certifications()" emptyMessage="Nenhuma certificação cadastrada para este fornecedor." />
  </div>
</app-modal>
