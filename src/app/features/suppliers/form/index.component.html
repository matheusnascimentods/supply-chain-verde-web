<main class="mx-auto max-w-2xl p-6"><a routerLink="../" class="text-emerald-700 underline">← Voltar</a><h1 class="my-5 text-2xl font-bold">{{ editing() ? 'Editar' : 'Cadastrar' }} fornecedor</h1><form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 rounded-xl border border-slate-200 bg-white p-6"><label class="grid gap-1 text-sm font-medium">Nome<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="name" /></label> <label class="grid gap-1 text-sm font-medium">CNPJ<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="cnpj" /></label> <label class="grid gap-1 text-sm font-medium">Telefone<input class="rounded-lg border border-slate-300 px-3 py-2" type="tel" formControlName="phone" /></label> <label class="grid gap-1 text-sm font-medium">Rua<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="street" /></label> <label class="grid gap-1 text-sm font-medium">Número<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="number" /></label> <label class="grid gap-1 text-sm font-medium">Bairro<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="neighborhood" /></label> <label class="grid gap-1 text-sm font-medium">Complemento<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="complement" /></label> <label class="grid gap-1 text-sm font-medium">CEP<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="zipCode" /></label> <label class="grid gap-1 text-sm font-medium">Cidade<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="city" /></label> <label class="grid gap-1 text-sm font-medium">Estado<input class="rounded-lg border border-slate-300 px-3 py-2" type="text" formControlName="state" /></label>@if (error()) { <p role="alert" class="text-red-700">{{error()}}</p> }<button class="rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white disabled:opacity-50" [disabled]="form.invalid || saving()">{{saving() ? 'Salvando…' : 'Salvar'}}</button></form></main>
