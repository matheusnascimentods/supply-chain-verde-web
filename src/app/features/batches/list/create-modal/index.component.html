<div class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-slate-950/45 p-4 sm:p-6" role="presentation" (click)="backdropClick($event)">
  <section #dialog tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="create-batch-title" class="my-auto w-full max-w-2xl overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl focus:outline-none">
    <header class="flex items-start justify-between border-b border-slate-100 px-6 py-5 sm:px-7">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.14em] text-emerald-700">Supply Chain Verde</p>
        <h2 id="create-batch-title" class="mt-1 text-xl font-bold tracking-tight text-slate-900">Cadastrar novo lote</h2>
        <p class="mt-1 text-sm text-slate-500">Informe o produto, fornecedor e dados de produção.</p>
      </div>
      <button type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-emerald-700" aria-label="Fechar cadastro de lote" [disabled]="saving()" (click)="requestDismiss()">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>

    @if (loadingChoices()) {
      <p class="px-6 py-10 text-center text-sm text-slate-500" aria-live="polite">Carregando produtos e fornecedores…</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-5 px-6 py-6 sm:grid-cols-2 sm:px-7">
        <label class="grid gap-1.5 text-sm font-medium text-slate-700 sm:col-span-2">
          Produto
          <select formControlName="productId" class="min-h-11 rounded-lg border border-slate-300 bg-white px-3 text-slate-900 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100">
            <option value="">Selecione um produto</option>
            @for (product of products(); track product.productId) { <option [value]="product.productId">{{ product.name }}</option> }
          </select>
          @if (form.controls.productId.touched && form.controls.productId.invalid) { <span class="text-xs font-normal text-red-700">Selecione um produto.</span> }
        </label>

        @if (isAdmin) {
          <label class="grid gap-1.5 text-sm font-medium text-slate-700 sm:col-span-2">
            Fornecedor
            <select formControlName="supplierId" class="min-h-11 rounded-lg border border-slate-300 bg-white px-3 text-slate-900 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100">
              <option value="">Selecione um fornecedor</option>
              @for (supplier of suppliers(); track supplier.supplierId) { <option [value]="supplier.supplierId">{{ supplier.name }}</option> }
            </select>
            @if (form.controls.supplierId.touched && form.controls.supplierId.invalid) { <span class="text-xs font-normal text-red-700">Selecione um fornecedor.</span> }
          </label>
        } @else {
          <div class="rounded-lg bg-emerald-50 px-3 py-3 text-sm text-emerald-900 sm:col-span-2">Este lote será vinculado ao fornecedor da sua conta.</div>
        }

        <label class="grid gap-1.5 text-sm font-medium text-slate-700">
          Quantidade
          <input formControlName="quantity" type="number" min="0.000001" step="any" inputmode="decimal" placeholder="Ex.: 500" class="min-h-11 rounded-lg border border-slate-300 px-3 text-slate-900 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
          @if (form.controls.quantity.touched && form.controls.quantity.invalid) { <span class="text-xs font-normal text-red-700">Informe uma quantidade maior que zero.</span> }
        </label>
        <label class="grid gap-1.5 text-sm font-medium text-slate-700">
          Data de produção
          <input formControlName="producedAt" type="date" class="min-h-11 rounded-lg border border-slate-300 px-3 text-slate-900 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
          @if (form.controls.producedAt.touched && form.controls.producedAt.invalid) { <span class="text-xs font-normal text-red-700">Informe a data de produção.</span> }
        </label>

        @if (error()) { <p role="alert" class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800 sm:col-span-2">{{ error() }}</p> }
        <footer class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:col-span-2 sm:flex-row sm:justify-end">
          <button type="button" class="min-h-11 rounded-lg border border-slate-300 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-50" [disabled]="saving()" (click)="requestDismiss()">Cancelar</button>
          <button type="submit" class="min-h-11 rounded-lg bg-emerald-700 px-5 text-sm font-semibold text-white hover:bg-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700 disabled:cursor-not-allowed disabled:opacity-50" [disabled]="form.invalid || saving()">{{ saving() ? 'Cadastrando…' : 'Cadastrar lote' }}</button>
        </footer>
      </form>
    }
  </section>
</div>
