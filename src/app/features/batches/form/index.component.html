<main class="component-style-1"><a routerLink="../" class="component-style-2">← Voltar</a><h1 class="component-style-3">{{ editing() ? 'Editar' : 'Cadastrar' }} lote</h1><form [formGroup]="form" (ngSubmit)="submit()" class="component-style-4"><label class="component-style-5">Produto (ID)<input class="component-style-6" type="number" formControlName="productId" /></label> <label class="component-style-5">Quantidade<input class="component-style-6" type="number" formControlName="quantity" /></label> <label class="component-style-5">Data de produção<input class="component-style-6" type="date" formControlName="producedAt" /></label> <label class="component-style-5">Validade<input class="component-style-6" type="date" formControlName="expirationDate" /></label>@if (error()) { <p role="alert" class="component-style-7">{{error()}}</p> }<button class="component-style-8" [disabled]="form.invalid || saving()">{{saving() ? 'Salvando…' : 'Salvar'}}</button></form></main>
