<app-modal labelledBy="reject-modal-title" describedBy="reject-modal-description" initialFocusSelector="input" [closeOnEscape]="!saving()" [closeOnBackdrop]="!saving()" (dismissed)="dismissed.emit()">
  <form class="reject-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header>
      <p class="reject-eyebrow">Lote #{{ batch().batchId }}</p>
      <h2 id="reject-modal-title" class="reject-title">Recusar lote</h2>
      <p id="reject-modal-description" class="reject-description">
        {{ batch().productName ?? 'Produto não identificado' }}@if (batch().marketName) { · pedido por {{ batch().marketName }} }.
        A recusa é definitiva, e o motivo fica visível para quem pediu.
      </p>
    </header>

    <app-text-field id="reject-reason" label="Motivo da recusa" formControlName="reason" [required]="true" [maxLength]="maxLength" placeholder="Ex.: Sem capacidade de produção para o período." [error]="reasonError()" />

    @if (error()) { <p class="reject-error" role="alert">{{ error() }}</p> }

    <div class="reject-actions">
      <button appButton variant="secondary" type="button" [disabled]="saving()" (click)="dismissed.emit()">Cancelar</button>
      <button appButton variant="danger" type="submit" data-testid="confirm-reject" [disabled]="saving()">{{ saving() ? 'Recusando…' : 'Recusar lote' }}</button>
    </div>
  </form>
</app-modal>
