<main class="landing">
  <img
    ngSrc="/landing/hero-bg.avif"
    fill
    priority
    alt="Contêiner coberto de vegetação içado por um guindaste sobre uma pilha de contêineres"
    class="landing-bg"
  />

  <span class="landing-word" aria-hidden="true">VERDE</span>

  <header class="landing-nav">
    <span class="landing-brand">
      <span class="landing-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="landing-brand-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 4c-7 0-12 2-13 7-1 4 2 7 6 6 5-1 7-6 7-13Z" />
          <path d="M4 21c2-5 5-8 11-11" />
        </svg>
      </span>
      Supply Chain Verde
    </span>
  </header>

  <p class="landing-side">Rastreabilidade de ponta a ponta</p>

  <section class="landing-card" aria-labelledby="landing-title">
    <h1 id="landing-title" class="landing-title">O futuro da cadeia de suprimentos é verde</h1>
    <p class="landing-subtitle">
      Rastreie cada lote da origem ao varejo, meça o CO₂ de cada etapa e escolha fornecedores mais sustentáveis.
    </p>
    <a routerLink="/login" class="landing-cta" data-testid="landing-cta">
      Entrar
      <span class="landing-cta-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="landing-cta-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17 17 7" />
          <path d="M8 7h9v9" />
        </svg>
      </span>
    </a>
  </section>
</main>
