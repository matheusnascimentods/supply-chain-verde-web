<main class="mx-auto max-w-2xl p-6"><a routerLink="../" class="text-emerald-700 underline">← Voltar</a><h1 class="my-5 text-2xl font-bold">{{ editing() ? 'Editar' : 'Cadastrar' }} relatório</h1><form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 rounded-xl border border-slate-200 bg-white p-6"><label class="grid gap-1 text-sm font-medium">Fornecedor (ID)<input class="rounded-lg border border-slate-300 px-3 py-2" type="number" formControlName="supplierId" /></label> <label class="grid gap-1 text-sm font-medium">Início do período<input class="rounded-lg border border-slate-300 px-3 py-2" type="date" formControlName="startDate" /></label> <label class="grid gap-1 text-sm font-medium">Fim do período<input class="rounded-lg border border-slate-300 px-3 py-2" type="date" formControlName="endDate" /></label>@if (error()) { <p role="alert" class="text-red-700">{{error()}}</p> }<button class="rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white disabled:opacity-50" [disabled]="form.invalid || saving()">{{saving() ? 'Salvando…' : 'Salvar'}}</button></form></main>
